# ByteTrack 追蹤器配置 - 針對沙灘排球場景優化

# 追蹤器類型
tracker_type: bytetrack

# ByteTrack 核心參數
track_high_thresh: 0.5      # 高置信度閾值 - 用於建立主要追蹤軌跡
track_low_thresh: 0.1       # 低置信度閾值 - 用於恢復遺失的追蹤
new_track_thresh: 0.6       # 新軌跡建立閾值 - 提高以減少誤判
track_buffer: 30            # 軌跡緩衝幀數 - 允許目標短暫消失30幀
match_thresh: 0.8           # IoU 匹配閾值 - 提高以增加追蹤穩定性

# 進階參數
min_box_area: 100           # 最小邊界框面積 (像素平方) - 過濾過小的偵測
mot20: False                # 是否使用 MOT20 模式 (適合高密度場景)

# 說明:
# - track_buffer=30: 允許球體被球網遮擋約1秒 (假設30fps)
# - match_thresh=0.8: 嚴格的匹配要求,減少ID切換
# - new_track_thresh=0.6: 避免背景雜訊被誤認為新目標
